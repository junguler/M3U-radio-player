<!doctype html><html lang=en>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiniAmp — Web Radio (Compact)</title>
<style>:root{--bg:#0e1015;--deck:#191c23;--panel:#1a1d26;--panel2:#222634;--txt:#e6eaf6;--muted:#9aa6be;--accent:#6ccff6;--accent2:#9a77ff;--ok:#44d07b;--warn:#ffc857;--err:#ff5f6f;--led:#92ff9a}*{box-sizing:border-box}html,body{height:100%;overflow:hidden}body{margin:0;color:var(--txt);background:radial-gradient(1200px 800px at 50% 100%,#14182a 0%,#0e1015 60%);font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,noto sans,sans-serif;display:grid;place-items:center}.app{width:min(92vw,760px);height:min(94vh,680px);display:flex;flex-direction:column;gap:8px;padding:10px 10px 12px;overflow:hidden}.ellipsis{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.deck{display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#1c202b,#121520);border:1px solid #2a2f46;border-radius:10px;padding:8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,5%);min-width:0;overflow:hidden}.status-dot{width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 10px var(--warn)}.title{flex:auto;min-width:0;background:#0a0d10;border:1px solid #202534;border-radius:6px;padding:6px 10px;color:var(--led);font-weight:600;font-size:14px;letter-spacing:.3px;box-shadow:inset 0 0 24px rgba(0,0,0,.55),inset 0 1px rgba(255,255,255,3%)}.badge{font-size:11px;color:var(--muted);background:#1a1f2e;border:1px solid #2a2f46;border-radius:999px;padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.deck>.badge{flex:initial;max-width:34%}.controls{background:var(--panel2);border:1px solid #2a2f46;border-radius:10px;padding:6px 8px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;overflow:hidden}.btn{appearance:none;border:none;cursor:pointer;background:linear-gradient(180deg,#2a3047,#20253a);border:1px solid #2f3551;color:#eef3ff;width:36px;height:32px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;transition:.15s t /* --- Compact mode overrides (scoped to .app.compact) --- */
/* Add only small, non-invasive overrides when .app has .compact */
.app.compact .deck { gap:8px; padding:6px 8px; border-radius:8px; }
.app.compact .title { font-size:13px; padding:6px 8px; }
.app.compact .deck > .badge { display:none; } /* hide badges to save space */
.app.compact .controls { padding:6px; gap:6px; border-radius:8px; flex-wrap:wrap; }
.app.compact .btn { min-width:36px; height:36px; padding:0 6px; border-radius:8px; font-size:15px; }
.app.compact .btn.small { width:36px; height:36px; font-size:14px; padding:0; }
.app.compact .volbox { padding:4px; gap:6px; }
.app.compact .volnum { min-width:40px; font-size:13px; }
.app.compact .sep { height:20px; margin:0 4px; }
.app.compact .playlist { border-radius:8px; }
.app.compact .plist-body { padding:4px; }
.app.compact #playlist li { padding:6px 8px; font-size:14px; border-radius:8px; }
.app.compact .hint { padding:6px; font-size:12px; }
/* Optional: hide some less-used control buttons in very tight space if you wrap them in .optional */
.app.compact .controls .optional { display:none; }
/* End compact overrides */
</style>
<div class=app role=application>
  <div class=deck>
    <div id=statusDot class=status-dot title=Status></div>
    <div id=nowTitle class="title ellipsis" title="Now Playing">—</div>
    <span id=statusText class="badge ellipsis">idle</span>
    <span id=featureBadge class="badge ellipsis" title="Audio features">WebAudio: init</span>
  </div>  <div class=controls>
    <button id=prevBtn class=btn title="Previous (←)">⏮️</button>
    <button id=playBtn class="btn ok" title="Play/Pause (Space)">▶️</button>
    <button id=stopBtn class="btn stop" title=Stop>⏹️</button>
    <button id=nextBtn class="btn" title="Next (→)">⏭️</button><div class=sep></div>
    <button id=shuffleBtn class="btn toggle" title=Shuffle>🔀</button>
    <button id=normBtn class="btn toggle on" title="Auto gain + limiter (AGC) on/off">🎚️</button><div class=sep></div>
    <button id=muteBtn class=btn title=Mute>🔇</button>
    <div class=volbox title="Volume (±10%)">
      <button id=volDown class="btn small" aria-label="Volume down">➖</button>
      <span id=volNum class=volnum>90%</span>
      <button id=volUp class="btn small" aria-label="Volume up">➕</button>
    </div>
    <div class=sep></div>
    <!-- wrap less-used buttons in .optional if you want them hidden in compact mode -->
    <div class="optional">
      <button id=addStreamBtn class="btn small" title="Add single stream URL">➕</button>
      <button id=loadUrlBtn class="btn small" title="Load .m3u from URL">🌐</button>
      <button id=loadFileBtn class="btn small" title="Load .m3u file">📂</button>
      <button id=pasteBtn class="btn small" title="Paste .m3u text">📋</button>
      <button id=exportBtn class="btn small" title="Export playlist (.m3u)">💾</button>
      <button id=clearBtn class="btn small" title="Clear playlist">🧹</button>
    </div>
  </div>  <div class=main>
    <div class=playlist>
      <div class=plist-body><ul id=playlist></ul></div>
      <div class=hint><span class=ellipsis>Drag & drop a .m3u anywhere</span>
      <span id=corsBadge class="badge ellipsis" title="CORS needed for metadata">CORS: ?</span></div>
    </div>
  </div>
</div>
<input id=fileInput type=file accept=.m3u,.m3u8,.txt hidden>
<audio id=audio crossorigin=anonymous></audio>
